<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: CoverSerif;
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; }
    body {
      background: #0c1018;
      color: #ece7dc;
      font-family: CoverSerif, "Liberation Serif", serif;
      position: relative;
    }
    .sky {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 46% 90% at 22% 42%, rgba(236, 231, 220, 0.12), transparent 64%),
        linear-gradient(90deg, #0c1018 0%, #151b26 58%, #0c1018 100%);
    }
    .noise {
      position: absolute; inset: 0; opacity: 0.07; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .pines {
      position: absolute; right: 0; bottom: 0; width: 58%; height: 264px;
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 18px;
      display: flex;
      align-items: center;
      gap: 22px;
      height: 148px;
      max-width: 500px;
    }
    .crest {
      width: 102px;
      height: 118px;
      flex: 0 0 auto;
      filter: drop-shadow(0 0 18px rgba(236, 231, 220, 0.16));
    }
    h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1;
      color: #ece7dc;
      padding-left: 0.08em;
      white-space: nowrap;
      text-shadow: 0 2px 16px rgba(12, 16, 24, 0.8);
    }
    .mote {
      position: absolute;
      border-radius: 50%;
      background: #ece7dc;
      box-shadow: 0 0 8px rgba(236, 231, 220, 0.3);
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <svg class="pines" viewBox="0 0 700 264" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
    <path fill="#0c1018" d="M40 264 L90 96 L140 264 L190 70 L250 264 L310 110 L370 264 L430 54 L500 264 L560 88 L620 264 L680 76 L700 264 L40 264 Z"/>
    <path fill="#151b26" d="M80 264 L128 140 L176 264 L230 118 L286 264 L350 150 L410 264 L478 96 L540 264 L600 136 L660 264 L700 120 L700 264 Z"/>
  </svg>
  <div class="mote" style="width:5px;height:5px;left:620px;top:72px;opacity:.35"></div>
  <div class="mote" style="width:3px;height:3px;left:780px;top:50px;opacity:.28"></div>
  <div class="mote" style="width:6px;height:6px;left:910px;top:110px;opacity:.22"></div>
  <div class="mote" style="width:4px;height:4px;left:1040px;top:64px;opacity:.2"></div>
  <div class="lockup">
    <svg class="crest" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ece7dc"/>
          <stop offset="100%" stop-color="#c8c4b8"/>
        </linearGradient>
      </defs>
      <path fill="url(#fur)" d="M24 110 L50 8 L98 100 Z"/>
      <path fill="url(#fur)" d="M176 110 L150 8 L102 100 Z"/>
      <path fill="#9a9488" d="M44 98 L56 30 L90 94 Z"/>
      <path fill="#9a9488" d="M156 98 L144 30 L110 94 Z"/>
      <path fill="url(#fur)" d="M38 106 C72 86 128 86 162 106 C180 132 174 162 100 222 C26 162 20 132 38 106 Z"/>
      <path fill="#ece7dc" d="M76 168 C100 156 124 168 100 204 C76 168 76 168 76 168 Z"/>
      <path fill="#0c1018" d="M100 174 L91 188 Q100 196 109 188 Z"/>
      <ellipse cx="76" cy="140" rx="7.2" ry="9.2" fill="#0c1018"/>
      <ellipse cx="124" cy="140" rx="7.2" ry="9.2" fill="#0c1018"/>
      <circle cx="78.2" cy="137" r="2.1" fill="#ece7dc"/>
      <circle cx="126.2" cy="137" r="2.1" fill="#ece7dc"/>
    </svg>
    <h1>EMBERFOX</h1>
  </div>
  <div class="noise"></div>
</body>
</html>
